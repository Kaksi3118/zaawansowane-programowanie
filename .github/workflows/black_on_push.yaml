name: Black on Commit

description: Run Black code formatter on commit to ensure code style consistency.

on: [push]

jobs:
  black:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install Black
        run: pip install black
      - name: Run Black
        run: black .
      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: reformat code with Black" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }} || echo "No changes to push"
  pycodestyle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install pycodestyle
        run: pip install pycodestyle
      - name: Run pycodestyle
        run: pycodestyle --exclude=__pycache__,__init__.py,.git .