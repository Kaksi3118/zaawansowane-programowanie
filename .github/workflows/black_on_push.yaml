name: Black on Commit

description: Run Black code formatter on commit to ensure code style consistency.

on: [push]

jobs:
  black:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Black
        run: pip install black

      - name: Install pycodestyle
        run: pip install pycodestyle

      - name: Run Black
        run: black .

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "style: reformat code with Black"
          git push origin HEAD:${{ github.ref_name }} || echo "No changes to push"
          
      - name: Run pycodestyle
        run: pycodestyle --exclude=__pycache__,__init__.py,.git .